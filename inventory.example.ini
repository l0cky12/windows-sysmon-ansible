# Example inventory for Sysmon deployment over WinRM
#
# Copy to inventory.ini and edit for your environment:
#   cp inventory.example.ini inventory.ini
#
# Credentials and connection vars live in group_vars/windows.yml
# (copy from group_vars/windows.example.yml). Prefer Ansible Vault
# for the password rather than putting it in plaintext here.

[windows]
win-server-01 ansible_host=192.168.122.146

[windows:vars]
# Windows hosts must use WinRM, not SSH.
# Keep these here so ad-hoc commands work even if group_vars is not loaded.
ansible_connection=winrm
ansible_user=Administrator
ansible_password=Violet-River-72!Lantern#Cloud
ansible_port=5986
ansible_winrm_scheme=https
ansible_winrm_transport=ntlm
ansible_winrm_server_cert_validation=ignore
